<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kang Kuk LEE | 포트폴리오</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: #202923; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1080px, 100%); min-height: 100vh; min-height: 100svh; margin: auto; padding: 80px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 100px; align-items: center; }
    .profile img { display: block; width: 200px; height: 300px; object-fit: cover; border-radius: 3px; margin-bottom: 34px; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 48px); font-weight: 500; letter-spacing: -1.8px; line-height: 1.2; }
    .name { margin: 14px 0 0; font-size: 19px; color: #657168; }
    .contents { list-style: none; padding: 0; margin: 0; border-top: 1px solid #c9cfc8; }
    .contents li { display: flex; gap: 28px; align-items: baseline; padding: 27px 0; border-bottom: 1px solid #dce0d9; }
    .number { color: #778779; font-size: 13px; font-variant-numeric: tabular-nums; }
    h2 { margin: 0; font-size: 25px; font-weight: 500; letter-spacing: -.6px; }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; gap: 50px; padding: 48px 28px; }
      .profile img { width: 160px; height: 240px; margin-bottom: 26px; }
      .contents li { padding: 22px 0; }
      h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <img src="profile.jpg" alt="이강국 프로필 사진" width="4000" height="6000">
      <h1>Kang Kuk LEE</h1>
      <p class="name">이 강 국</p>
    </header>
    <ol class="contents" aria-label="포트폴리오 목차">
      <li><span class="number">01</span><h2>소개</h2></li>
      <li><span class="number">02</span><h2>경력</h2></li>
      <li><span class="number">03</span><h2>기술</h2></li>
      <li><span class="number">04</span><h2>분석법</h2></li>
      <li><span class="number">05</span><h2>프로젝트</h2></li>
      <li><span class="number">06</span><h2>교육</h2></li>
    </ol>
  </main>
</body>
</html>
